<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Natural or Implant - Mobile Quiz</title>
<style>
:root {
  --bg:#0b0d10; --panel:#151922; --panel2:#1d2430; --text:#f5f7fb;
  --muted:#aeb7c7; --border:#30394a; --accent:#8ea6ff;
  --good:#42d67d; --bad:#ff6272; --warn:#f2c766;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; min-height:100%; background:#0b0d10; color:var(--text); font-family:Arial, Helvetica, sans-serif; }
body { background:radial-gradient(circle at top,#172033 0,#0b0d10 45%,#08090b 100%); }
button { font:inherit; cursor:pointer; touch-action:manipulation; }
.app { width:min(760px,100%); margin:0 auto; padding:14px 14px 118px; }
header { position:sticky; top:0; z-index:5; margin:-14px -14px 0; padding:18px 14px 12px; background:linear-gradient(to bottom,rgba(11,13,16,.98),rgba(11,13,16,.78)); backdrop-filter:blur(14px); }
h1 { font-size:clamp(30px,8vw,48px); line-height:1; margin:0 0 8px; letter-spacing:-.06em; }
.sub { margin:0; color:var(--muted); font-size:15px; line-height:1.35; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0; }
.stat { background:rgba(21,25,34,.92); border:1px solid var(--border); border-radius:16px; padding:10px 8px; min-height:64px; }
.stat b { display:block; font-size:24px; line-height:1; }
.stat span { display:block; color:var(--muted); font-size:12px; margin-top:7px; }
.card { background:linear-gradient(180deg,rgba(31,37,50,.96),rgba(17,21,29,.96)); border:1px solid var(--border); border-radius:24px; padding:12px; box-shadow:0 18px 58px rgba(0,0,0,.36); }
.tileWrap { position:relative; width:100%; aspect-ratio:460/430; border-radius:20px; overflow:hidden; background:#090b0f; border:1px solid #3b4558; }
